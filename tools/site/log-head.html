<title>Vikash PM Decision Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a single reading column, a status strip per company, then a ledger of decisions in log order. */
:root{
  --bg:#f3f5f6; --surface:#ffffff; --fg:#1b2428; --muted:#5b6a71; --line:#d8dee1;
  --accent:#0f5f63; --accent-soft:#e1efef; --warn:#8a5a00; --warn-soft:#fbf0d9; --ok:#2c6b3f; --ok-soft:#e3f1e6;
  --display:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121819; --surface:#1a2224; --fg:#e4eaec; --muted:#9aa9ae; --line:#2c3739;
  --accent:#6cc3c4; --accent-soft:#183133; --warn:#e8b65c; --warn-soft:#2e2615; --ok:#7fc994; --ok-soft:#18291d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121819; --surface:#1a2224; --fg:#e4eaec; --muted:#9aa9ae; --line:#2c3739;
  --accent:#6cc3c4; --accent-soft:#183133; --warn:#e8b65c; --warn-soft:#2e2615; --ok:#7fc994; --ok-soft:#18291d; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.6}
.wrap{max-width:860px;margin:0 auto;padding-inline:16px;padding-block:40px 64px;display:flex;flex-direction:column;gap:36px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:2.1rem;font-weight:600}
h2{font-size:1.35rem;font-weight:600}
h3{font-size:1.08rem;font-weight:600}
p{margin:0}
.eyebrow{font-family:var(--mono);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
header{display:flex;flex-direction:column;gap:8px}
header p{color:var(--muted);max-width:62ch}
section{display:flex;flex-direction:column;gap:14px}
.strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:620px){.strip{grid-template-columns:1fr}}
.co{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.co .row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.co small{color:var(--muted);font-size:.85rem}
.pill{font-family:var(--mono);font-size:.72rem;padding:2px 8px;border-radius:99px;white-space:nowrap}
.pill.now{background:var(--accent-soft);color:var(--accent)}
.pill.next{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.pill.open{background:var(--warn-soft);color:var(--warn)}
.pill.done{background:var(--ok-soft);color:var(--ok)}
.open-card{background:var(--warn-soft);border:1px solid var(--line);border-radius:6px;padding:18px;display:flex;flex-direction:column;gap:14px}
.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:620px){.options{grid-template-columns:1fr}}
.opt{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.opt .k{font-family:var(--mono);font-size:.8rem;color:var(--accent);font-weight:500}
.opt p{font-size:.92rem}
.opt .why{color:var(--muted);font-size:.85rem}
.opt.rec{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.ledger{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.entry{display:grid;grid-template-columns:72px minmax(0,1fr);gap:16px;padding:18px 0;border-bottom:1px solid var(--line)}
@media (max-width:520px){.entry{grid-template-columns:1fr;gap:6px}}
.entry .id{font-family:var(--mono);font-size:.85rem;color:var(--accent);font-weight:500;display:flex;flex-direction:column;gap:2px}
.entry .id span{color:var(--muted);font-weight:400;font-size:.75rem}
.entry .body{display:flex;flex-direction:column;gap:8px;min-width:0}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tag{font-family:var(--mono);font-size:.72rem;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 6px}
dl{margin:0;display:grid;grid-template-columns:110px minmax(0,1fr);gap:4px 12px;font-size:.93rem}
@media (max-width:520px){dl{grid-template-columns:1fr}dt{margin-top:4px}}
dt{color:var(--muted);font-size:.8rem;font-family:var(--mono);padding-top:2px}
dd{margin:0}
ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
a{color:var(--accent);text-underline-offset:2px}
a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sources li{font-size:.9rem}
.note{font-size:.88rem;color:var(--muted)}
</style>
